name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint + Typecheck + Unit tests ─────────────────────────────────────────
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --coverage --coverageReporters=text-summary

  # ─── E2E smoke test (web, no Ollama AI generation) ─────────────────────────
  e2e-smoke:
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run WDIO smoke tests
        env:
          BASE_URL: https://practicetestautomation.com
          # Skip Ollama lifecycle — not available in CI without a service container
          SKIP_OLLAMA_CHECK: 'true'
          WDIO_MAX_INSTANCES: '1'
        run: npm run wdio -- --spec src/features/sample.feature
        # Allow failure here until generated sample.feature is stable in CI
        continue-on-error: true

  # ─── Dependency audit ──────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run audit
        # --audit-level=high only fails on high/critical vulns; moderate is expected in test tooling
        run: npm audit --audit-level=high
